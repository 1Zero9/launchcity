name: LL2 egress spike (disposable - architecture evidence gathering)

# Temporary, manually-dispatched workflow. See
# docs/architecture/2026-09-16-refresh-platform-review.md (Part 4). Makes
# at most two anonymous, read-only GET requests to Launch Library 2 from a
# GitHub-hosted runner, to compare against a natural Cloudflare Cron cycle.
# No retries, no polling, no token, no response body/IP/secret is printed.
# Removed immediately after its single dispatch.

on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /launch/upcoming/ (exact LaunchCity production endpoint)
        run: |
          URL="https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=30&mode=detailed"
          TS_START=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          set +e
          METRICS=$(curl -sS -o /tmp/upcoming_body.json -D /tmp/upcoming_headers.txt \
            -w '%{http_code} %{time_total} %{size_download}' \
            --max-time 20 \
            -H "Accept: application/json" \
            "$URL")
          CURL_EXIT=$?
          set -e
          TS_END=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)

          if [ $CURL_EXIT -eq 0 ]; then
            HTTP_CODE=$(echo "$METRICS" | awk '{print $1}')
            DURATION_S=$(echo "$METRICS" | awk '{print $2}')
            SIZE_BYTES=$(echo "$METRICS" | awk '{print $3}')
          else
            HTTP_CODE="000-transport-failure"
            DURATION_S="n/a"
            SIZE_BYTES="0"
          fi

          RETRY_AFTER=$(grep -i '^retry-after:' /tmp/upcoming_headers.txt 2>/dev/null | sed -E 's/^[Rr]etry-[Aa]fter: *//' | tr -d '\r' || true)
          RATE_HEADERS=$(grep -iE '^(x-ratelimit|ratelimit|x-throttle)' /tmp/upcoming_headers.txt 2>/dev/null | tr -d '\r' || true)

          {
            echo "## LL2 request 1: /launch/upcoming/"
            echo "- timestamp_start_utc: $TS_START"
            echo "- timestamp_end_utc: $TS_END"
            echo "- path: /2.2.0/launch/upcoming/?limit=30&mode=detailed"
            echo "- http_status: $HTTP_CODE"
            echo "- duration_seconds: $DURATION_S"
            echo "- response_size_bytes: $SIZE_BYTES"
            echo "- retry_after: ${RETRY_AFTER:-none present}"
            echo "- documented_rate_limit_headers: ${RATE_HEADERS:-none present}"
            echo "- runner: ubuntu-latest ($(uname -srm))"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: GET /api-throttle/ (LL2's documented throttle-status endpoint)
        run: |
          URL="https://ll.thespacedevs.com/2.2.0/api-throttle/"
          TS_START=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          set +e
          METRICS=$(curl -sS -o /tmp/throttle_body.json -D /tmp/throttle_headers.txt \
            -w '%{http_code} %{time_total} %{size_download}' \
            --max-time 20 \
            -H "Accept: application/json" \
            "$URL")
          CURL_EXIT=$?
          set -e
          TS_END=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)

          if [ $CURL_EXIT -eq 0 ]; then
            HTTP_CODE=$(echo "$METRICS" | awk '{print $1}')
            DURATION_S=$(echo "$METRICS" | awk '{print $2}')
            SIZE_BYTES=$(echo "$METRICS" | awk '{print $3}')
          else
            HTTP_CODE="000-transport-failure"
            DURATION_S="n/a"
            SIZE_BYTES="0"
          fi

          RETRY_AFTER=$(grep -i '^retry-after:' /tmp/throttle_headers.txt 2>/dev/null | sed -E 's/^[Rr]etry-[Aa]fter: *//' | tr -d '\r' || true)
          RATE_HEADERS=$(grep -iE '^(x-ratelimit|ratelimit|x-throttle)' /tmp/throttle_headers.txt 2>/dev/null | tr -d '\r' || true)

          # This endpoint's own documented purpose is a small, non-launch-data
          # throttle-status payload (current limit/usage/reset) - print it as
          # diagnostic metadata, not "response body" in the launch-data sense.
          THROTTLE_BODY=$(cat /tmp/throttle_body.json 2>/dev/null | head -c 500 || true)

          {
            echo ""
            echo "## LL2 request 2: /api-throttle/"
            echo "- timestamp_start_utc: $TS_START"
            echo "- timestamp_end_utc: $TS_END"
            echo "- path: /2.2.0/api-throttle/"
            echo "- http_status: $HTTP_CODE"
            echo "- duration_seconds: $DURATION_S"
            echo "- response_size_bytes: $SIZE_BYTES"
            echo "- retry_after: ${RETRY_AFTER:-none present}"
            echo "- documented_rate_limit_headers: ${RATE_HEADERS:-none present}"
            echo "- throttle_status_payload: $THROTTLE_BODY"
            echo "- runner: ubuntu-latest ($(uname -srm))"
          } | tee -a "$GITHUB_STEP_SUMMARY"
